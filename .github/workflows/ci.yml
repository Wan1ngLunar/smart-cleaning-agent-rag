name: CI

# 推送到主分支、创建或更新Pull Request时自动检查，也允许在GitHub页面手动运行。
"on":
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

# CI只需要读取仓库源码，不授予写入仓库或其他资源的权限。
permissions:
  contents: read

jobs:
  quality:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # 测试只创建模型客户端，不调用真实模型接口，因此使用明确的CI占位值。
      DASHSCOPE_API_KEY: ci-placeholder-key
      # 强制Python使用UTF-8，确保Linux与本地Windows采用一致的文本编码。
      PYTHONUTF8: "1"

    steps:
      # 下载触发本次工作流的仓库代码。
      - name: Check out repository
        uses: actions/checkout@v6

      # 安装项目已验证的Python版本，并按依赖文件内容缓存pip下载结果。
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # 开发依赖文件会同时安装运行依赖、测试工具和Ruff。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Ruff负责阻止明显语法错误、未定义名称和错误导入顺序进入主分支。
      - name: Run Ruff
        run: python -m ruff check .

      # 60%是当前62%基线的保护下限，低于该值时CI会失败。
      - name: Run tests with coverage
        run: python -m pytest --cov --cov-fail-under=60 -q
