# 两个服务复用同一个构建配置和本地镜像。
x-application-image: &application-image
  build:
    context: .
    dockerfile: Dockerfile
  image: smart-cleaning-agent:local

services:
  api:
    # 合并上方公共镜像配置，避免重复维护构建参数。
    <<: *application-image

    container_name: smart-cleaning-agent-api
    init: true

    # 只有后端读取真实模型密钥。
    env_file:
      - .env

    # 宿主机可访问Swagger和健康接口。
    ports:
      - "8000:8000"

    # Chroma、SQLite会话和日志只属于后端。
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs

    command:
      - python
      - -m
      - uvicorn
      - backend.main:app
      - --host=0.0.0.0
      - --port=8000

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health',
          timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    restart: unless-stopped

  web:
    # 前端与后端使用相同代码镜像，但运行不同进程。
    <<: *application-image

    container_name: smart-cleaning-agent-web
    init: true

    # Docker服务名api可通过内部网络解析为后端容器。
    # 前端不需要DASHSCOPE_API_KEY。
    environment:
      API_BASE_URL: http://api:8000

    ports:
      - "8501:8501"

    # 后端健康后再启动前端，减少启动阶段连接失败。
    depends_on:
      api:
        condition: service_healthy

    command:
      - python
      - -m
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8501/_stcore/health',
          timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    restart: unless-stopped
