# 这组用例用于评估Chroma能否把正确知识文件排在前k个结果中。
# positive表示问题应由知识库回答，negative表示知识库不应回答。
cases:
  # id是稳定的用例标识，后续评估结果会使用它定位失败项。
  - id: small_home_selection
    kind: positive
    query: "80平方米的小户型应该选择多长续航、什么水箱容量的扫地机器人？"
    expected_sources:
      - "选购指南.txt"

  - id: daily_sensor_maintenance
    kind: positive
    query: "扫地机器人的防跌落传感器和充电触点日常应该怎样保养？"
    expected_sources:
      - "维护保养.txt"

  - id: sweep_without_mop
    kind: positive
    query: "扫拖一体机器人如何设置成只扫地不拖地？"
    expected_sources:
      - "扫拖一体机器人100问.txt"

  - id: no_power_response
    kind: positive
    query: "机器人开机没有反应而且指示灯不亮，应该检查哪些部件？"
    expected_sources:
      - "故障排除.txt"

  - id: first_use_setup
    kind: positive
    query: "扫地机器人首次使用时，从拆除包装到建图应该怎么操作？"
    expected_sources:
      - "扫地机器人100问2.txt"

  - id: dtof_navigation
    kind: positive
    query: "dToF导航技术是什么，最远探测距离大约是多少？"
    expected_sources:
      - "扫地机器人100问.pdf"

  # 第一批扩充正例：每份知识文件增加两个不同主题的问题。
  # 问题使用自然改写，不直接复制资料原句，避免评估变成关键词背诵。
  - id: bedroom_noise_limit
    kind: positive
    query: "卧室使用的扫地机器人，工作噪音最好控制在多少分贝以内？"
    expected_sources:
      - "选购指南.txt"

  - id: allergy_filter_level
    kind: positive
    query: "家里有人容易过敏，选购时HEPA滤网至少应该达到什么等级？"
    expected_sources:
      - "选购指南.txt"

  - id: operating_temperature_maintenance
    kind: positive
    query: "扫地机器人应该避免在哪些高温或低温环境中长时间工作？"
    # 两份资料都直接说明了冬季低温和夏季高温环境下的使用注意事项。
    expected_sources:
      - "维护保养.txt"
      - "扫地机器人100问2.txt"

  - id: charging_base_infrared_cleaning
    kind: positive
    query: "充电座的红外感应区应该多久清理一次，具体怎样清理？"
    expected_sources:
      - "维护保养.txt"

  - id: cleaning_solution_ratio
    kind: positive
    query: "往扫拖机器人水箱添加专用清洁液时，建议按什么比例兑水？"
    expected_sources:
      - "扫拖一体机器人100问.txt"

  - id: floor_water_level
    kind: positive
    query: "木地板和瓷砖拖地时，出水量档位分别应该怎样设置？"
    expected_sources:
      # 两份资料都直接包含不同地面对应的出水量建议。
      - "扫拖一体机器人100问.txt"
      - "维护保养.txt"

  - id: partition_selection_failure
    kind: positive
    query: "地图已经建立，但APP里无法选择分区清扫区域，应该怎样排查？"
    expected_sources:
      # 两份故障资料都包含地图、APP和分区设置排查步骤。
      - "故障排除.txt"
      - "扫地机器人100问2.txt"

  - id: overheating_with_smell
    kind: positive
    query: "扫地机器人严重发热并伴有异味时，应立即做什么并检查哪些部件？"
    expected_sources:
      - "故障排除.txt"

  - id: low_battery_immediate_recharge
    kind: positive
    query: "机器人开机后直接返回充电座，电量低于多少时属于正常优先回充？"
    expected_sources:
      # 修正知识数据后，两份资料都能够回答20%的回充阈值。
      - "扫地机器人100问2.txt"
      - "选购指南.txt"

  - id: carpet_dust_boost
    kind: positive
    query: "地毯上的灰尘清理不彻底，应开启什么功能并怎样调整吸力？"
    expected_sources:
      # 以下资料均明确提到地毯增压或地毯深度清扫。
      - "扫地机器人100问2.txt"
      - "扫地机器人100问.pdf"
      - "选购指南.txt"
      - "维护保养.txt"

  - id: structured_light_principle
    kind: positive
    query: "3D结构光避障是怎样测量障碍物距离和形状的？"
    expected_sources:
      - "扫地机器人100问.pdf"

  - id: long_charge_battery_protection
    kind: positive
    query: "扫地机器人长时间放在充电座上会损坏电池吗，现代锂电池有什么保护？"
    expected_sources:
      - "扫地机器人100问.pdf"

  # 第二批扩充正例：覆盖选购参数、维护周期、拖地功能、故障和技术原理。
  - id: complex_layout_navigation_choice
    kind: positive
    query: "家里户型复杂并且有强光区域，激光导航和视觉导航应该怎样选择？"
    expected_sources:
      # 两份资料都包含激光与视觉导航的适用场景。
      - "选购指南.txt"
      - "扫地机器人100问.pdf"

  - id: warranty_policy_selection
    kind: positive
    query: "选购扫地机器人时，整机和电机、电池等核心部件的保修期建议达到多久？"
    expected_sources:
      - "选购指南.txt"

  - id: pet_waste_body_cleaning
    kind: positive
    query: "扫地机器人不慎沾到宠物粪便后，应该使用什么方式和清洁剂处理？"
    expected_sources:
      - "维护保养.txt"

  - id: monthly_battery_compartment_check
    kind: positive
    query: "每月检查扫地机器人的电池仓时，需要注意电池和排线的哪些异常？"
    expected_sources:
      - "维护保养.txt"

  - id: water_tank_leak_handling
    kind: positive
    query: "扫拖机器人水箱加水后漏水，应检查水箱盖、密封圈和出水管的哪些问题？"
    expected_sources:
      # 使用说明和故障资料都包含水箱漏水排查。
      - "扫拖一体机器人100问.txt"
      - "故障排除.txt"

  - id: mop_automatic_lifting
    kind: positive
    query: "支持拖布抬升的机器人会在回充、经过地毯或完成清扫时怎样处理拖布？"
    expected_sources:
      - "扫拖一体机器人100问.txt"

  - id: frequent_furniture_collision
    kind: positive
    query: "扫地机器人频繁碰撞家具时，应怎样检查避障传感器和防撞条？"
    expected_sources:
      - "故障排除.txt"

  - id: charging_light_flashing
    kind: positive
    query: "机器人充电时指示灯闪烁且无法正常充电，应检查哪些触点、适配器和电池问题？"
    expected_sources:
      - "故障排除.txt"

  - id: incomplete_map_reflection
    kind: positive
    query: "建图不完整或地图错乱时，镜面等反光物和移动障碍物应该怎样处理？"
    expected_sources:
      # 两份资料都要求处理反光物、清理障碍并重新建图。
      - "扫地机器人100问2.txt"
      - "故障排除.txt"

  - id: no_automatic_recharge_after_cleaning
    kind: positive
    query: "清扫结束后机器人不自动回充，应检查APP设置、充电座位置和回充传感器吗？"
    expected_sources:
      # 使用问答和故障资料都包含自动回充排查。
      - "扫地机器人100问2.txt"
      - "故障排除.txt"

  - id: pascal_suction_examples
    kind: positive
    query: "扫地机器人吸力参数中的Pa表示什么，2000Pa和2500Pa大致能清理哪些物品？"
    expected_sources:
      - "扫地机器人100问.pdf"

  - id: pet_waste_visual_recognition
    kind: positive
    query: "有些扫地机器人为什么能够识别并避开宠物粪便，主要依靠什么识别能力？"
    expected_sources:
      - "扫地机器人100问.pdf"

  # 第三批扩充正例：为每份知识文件再补充一个独立主题。
  - id: threshold_crossing_selection
    kind: positive
    query: "家中门槛高度不超过2厘米，选购机器人时越障能力至少应该达到多少？"
    expected_sources:
      - "选购指南.txt"

  - id: hepa_filter_maintenance_cycle
    kind: positive
    query: "HEPA滤网应该多久清理、多久水洗一次，并在使用多长时间后更换？"
    expected_sources:
      - "维护保养.txt"

  - id: empty_water_tank_behavior
    kind: positive
    query: "扫拖机器人水箱缺水后会自动停止吗，扫地功能是否还能继续？"
