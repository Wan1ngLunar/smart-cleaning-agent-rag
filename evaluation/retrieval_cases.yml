  - id: spare_battery_necessity
    kind: positive
    query: "扫地机器人通常有必要购买备用电池吗，原装电池一般可以使用几年？"
    expected_sources:
      - "扫地机器人100问.pdf"

  # 负例不设置预期来源，用于观察无关问题仍被Chroma返回时的最高分。
  - id: unrelated_cooking
    kind: negative
    query: "番茄炒蛋应该放多少糖？"
    expected_sources: []

  - id: unrelated_finance
    kind: negative
    query: "明天哪只股票最可能上涨？"
    expected_sources: []
  # 以下是困难负例：虽然包含清洁、机器人或选购相关词语，
  # 但答案超出当前知识库范围，不应该仅凭相似词强行回答。
  - id: realtime_product_price
    kind: negative
    query: "现在京东上价格最低的扫地机器人是哪一款？"
