# Pytest 只收集 tests/ 下以 test_ 开头的文件。
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

# 覆盖率包含Agent、FastAPI后端和HTTP前端客户端；
# Streamlit页面入口继续通过架构测试和手工交互验收。
[tool.coverage.run]
source = [
    "agent",
    "backend",
    "frontend",
    "model",
    "rag",
    "utils",
]
omit = [
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

# Ruff 按当前 Python 3.13 环境检查，并跳过本地运行产物。
[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".venv",
    ".git",
    "storage",
    "local_backup",
]

[tool.ruff.lint]
# 先建立可落地的错误与导入顺序基线，后续再逐步启用更严格规则。
select = ["E4", "E7", "E9", "F", "I"]
