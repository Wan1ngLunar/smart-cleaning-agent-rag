[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["agent", "model", "rag", "utils"]
omit = [
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".venv",
    ".git",
    "storage",
    "local_backup",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]